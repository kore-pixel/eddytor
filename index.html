<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#efefed">
<title>별문서</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- 문서 폰트: 프리텐다드 / 코펍월드돋움 / 나눔명조 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0/dotum.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 편집 앱 ===== -->
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="brand-star"></span><span class="brand-name">별문서</span></div>
    <div class="side-actions">
      <button class="btn primary" id="newDoc">＋ 문서</button>
      <button class="btn" id="newFolder">＋ 폴더</button>
    </div>
    <div class="space-label"><span>스페이스</span></div>
    <div id="tree"></div>
    <div class="side-foot">
      <button class="btn ghost" id="btnBackup">백업 · 복원</button>
    </div>
  </aside>
  <div id="backdrop"></div>

  <main id="main">
    <header id="topbar">
      <button class="tb only-mobile" id="menuBtn" aria-label="스페이스 열기">☰</button>
      <span id="saveState"></span>
      <div class="spacer"></div>
      <button class="btn" id="btnShare">공유</button>
      <button class="btn primary" id="btnExport">내보내기</button>
    </header>

    <div id="toolbar" role="toolbar">
      <button class="tb" data-act="undo" title="실행 취소">↶</button>
      <button class="tb" data-act="redo" title="다시 실행">↷</button>
      <i class="sep"></i>
      <select id="fontSel" title="글꼴">
        <option value="pretendard">프리텐다드</option>
        <option value="kopub">코펍월드돋움</option>
        <option value="myeongjo">나눔명조</option>
      </select>
      <i class="sep"></i>
      <button class="tb" data-act="size-down" title="글자 작게">−</button>
      <input id="sizeInp" inputmode="decimal" value="16" title="글자 크기(px)">
      <button class="tb" data-act="size-up" title="글자 크게">＋</button>
      <i class="sep"></i>
      <button class="tb" data-act="bold" data-st="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
      <button class="tb" data-act="italic" data-st="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
      <button class="tb" data-act="underline" data-st="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
      <button class="tb" data-act="strike" data-st="strikeThrough" title="취소선 (Ctrl+Shift+X)"><s>S</s></button>
      <i class="sep"></i>
      <span class="stepper" title="자간">
        <span class="lbl">자간</span>
        <button class="tb" data-act="sp-down">−</button>
        <span class="val" id="spVal">0%</span>
        <button class="tb" data-act="sp-up">＋</button>
      </span>
      <span class="stepper" title="줄간격">
        <span class="lbl">줄간격</span>
        <button class="tb" data-act="lh-down">−</button>
        <span class="val" id="lhVal">1.8</span>
        <button class="tb" data-act="lh-up">＋</button>
      </span>
      <i class="sep"></i>
      <button class="tb" data-act="color" title="글자 색"><span class="ico-a">A</span><span class="ico-bar" id="colorBar"></span></button>
      <button class="tb" data-act="hl" title="하이라이트"><span class="ico-hl">가</span></button>
      <i class="sep"></i>
      <button class="tb" data-act="left" data-al="left" title="왼쪽 정렬"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 6.5h8M2 10h12M2 13.5h8"/></svg></button>
      <button class="tb" data-act="center" data-al="center" title="가운데 정렬"><svg viewBox="0 0 16 16"><path d="M2 3h12M4 6.5h8M2 10h12M4 13.5h8"/></svg></button>
      <button class="tb" data-act="right" data-al="right" title="오른쪽 정렬"><svg viewBox="0 0 16 16"><path d="M2 3h12M6 6.5h8M2 10h12M6 13.5h8"/></svg></button>
      <button class="tb" data-act="justify" data-al="justify" title="양쪽 정렬"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 6.5h12M2 10h12M2 13.5h12"/></svg></button>
    </div>

    <div id="scroller">
      <div id="page" hidden>
        <input id="docTitle" placeholder="제목 없음" autocomplete="off" spellcheck="false">
        <div id="editor" class="rich" contenteditable="true" spellcheck="false"></div>
      </div>
      <div id="empty" hidden>
        <div class="big-star"></div>
        <p>왼쪽 스페이스에서 문서를 고르거나<br>새 문서를 만들어 보세요.</p>
      </div>
    </div>

    <footer id="status"><span id="count"></span></footer>
  </main>
</div>

<!-- ===== 공유 문서 보기 ===== -->
<div id="viewer">
  <header class="v-head"><span class="brand-star"></span><span class="brand-name">별문서</span></header>
  <article class="v-paper">
    <h1 id="viewerTitle"></h1>
    <div id="viewerMeta"></div>
    <div id="viewerDoc" class="rich"></div>
    <p id="viewerMsg" class="v-msg">불러오는 중…</p>
  </article>
</div>

<dialog id="dlg">
  <div class="dlg-star"></div>
  <h3 id="dlgTitle"></h3>
  <div id="dlgBody"></div>
  <div id="dlgActions"></div>
</dialog>
<div id="menu" hidden></div>
<div id="colorPop" hidden></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
